<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mapa Acessivel</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#e9edee;--panel:#fbfcfc;--ink:#14282b;--muted:#5c7175;--line:#c9d3d5;--accent:#0b7a75;--accent-ink:#fff;--red:#d62d20;--blue:#1f6fe0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1c;--panel:#172427;--ink:#e3eeee;--muted:#8fa6a9;--line:#2a3d40;--accent:#3cc4bb;--accent-ink:#06211f;--red:#ff5446;--blue:#5aa2ff}}
:root[data-theme="dark"]{--bg:#0f1a1c;--panel:#172427;--ink:#e3eeee;--muted:#8fa6a9;--line:#2a3d40;--accent:#3cc4bb;--accent-ink:#06211f;--red:#ff5446;--blue:#5aa2ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;overflow:hidden}
#stage{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;background:var(--bg)}
#stage.drag{cursor:grabbing}
#stage.placing,#stage.placing.drag{cursor:none}
#img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none;will-change:transform;box-shadow:0 2px 24px rgba(0,0,0,.25)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#menuBtn{position:absolute;left:14px;top:calc(14px + env(safe-area-inset-top,0px));z-index:5;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
#menuBtn svg{width:22px;height:22px;stroke:var(--ink)}
#side{position:absolute;left:0;top:0;bottom:0;width:280px;max-width:86vw;z-index:10;background:var(--panel);border-right:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top,0px)) 18px 18px;transform:translateX(-100%);transition:transform .25s ease;display:flex;flex-direction:column;gap:20px;overflow-y:auto}
#side.open{transform:none}
#scrim{position:absolute;inset:0;z-index:9;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
.head{display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;margin:0;font-weight:650}
.x{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:transparent}
h2{font-size:14px;margin:0 0 8px;font-weight:600;color:var(--muted)}
.row{display:flex;gap:8px}
.btn{flex:1;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;text-align:center}
.btn:hover{border-color:var(--accent)}
.report{width:100%;border:2px solid var(--red);font-weight:600}
.report:hover{border-color:var(--red);background:rgba(214,45,32,.1)}
input[type=range]{width:100%;accent-color:var(--accent)}
.zoomval{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
p.tip{margin:0;font-size:14px;line-height:1.55;color:var(--muted)}
#badge{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;font-variant-numeric:tabular-nums}


#layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:3}
.pin{position:absolute;width:28px;height:36px;padding:0;border:0;background:none;transform:translate(-50%,-100%);pointer-events:auto;z-index:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.pin svg{display:block}
#layer.hold .pin{pointer-events:none}
#ghost{position:absolute;z-index:3;display:none;pointer-events:none;opacity:.85;transform:translate(-50%,-100%);width:28px;height:36px}
#hint{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:6;display:none;background:var(--panel);border:2px solid var(--red);border-radius:8px;padding:8px 12px;font-size:14px;max-width:calc(100% - 140px);text-align:center}
.pop{position:absolute;z-index:2;display:none;width:250px;background:var(--panel);border:2px solid var(--red);border-radius:10px;padding:12px;pointer-events:auto;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.pop label{display:block;font-size:14px;font-weight:600;margin:0 30px 6px 0}
.popx{position:absolute;right:6px;top:6px;width:28px;height:28px;border:0;border-radius:6px;background:transparent;line-height:1;font-size:16px}
.popx:hover{background:rgba(214,45,32,.15)}
.pop textarea{width:100%;height:96px;resize:vertical;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
.pop textarea.bad{border-color:var(--red)}
.votes{display:flex;gap:8px;margin-top:10px}
.vote{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 10px;border-radius:8px;border:2px solid;background:transparent;font-size:13px;font-variant-numeric:tabular-nums}
.vote svg{width:16px;height:16px;fill:currentColor}
.vote.down svg{transform:rotate(180deg)}
.vote.up{color:var(--blue);border-color:var(--blue)}
.vote.down{color:var(--red);border-color:var(--red)}
.vote.on.up{background:var(--blue);color:#fff}
.vote.on.down{background:var(--red);color:#fff}
.vote:disabled{opacity:.4;cursor:not-allowed}
.err{margin:6px 0 0;font-size:13px;color:var(--red);min-height:0}
@media (prefers-reduced-motion:reduce){#side,#scrim{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <img id="img" alt="Zoomable image" draggable="false">
  <div id="layer">
    <div id="ghost"></div>
    <div class="pop" id="pop" role="dialog" aria-label="Report description">
      <button class="popx" id="popx" aria-label="Close">✕</button>
      <label for="desc">Descrição</label>
      <textarea id="desc" placeholder="Descreva o que você encontrou aqui"></textarea>
      <p class="err" id="err" role="alert"></p>
      <div class="votes">
        <button class="vote up" id="like" type="button" aria-label="Like" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 21h4V9H2v12zm20-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L13.17 1 6.59 7.59C6.22 7.95 6 8.45 6 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg><span id="nl">0</span></button>
        <button class="vote down" id="dislike" type="button" aria-label="Dislike" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 21h4V9H2v12zm20-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L13.17 1 6.59 7.59C6.22 7.95 6 8.45 6 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg><span id="nd">0</span></button>
      </div>
    </div>
  </div>
</div>

<div id="hint">Click on the image to place the pin. Press Esc to cancel.</div>
<button id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="side">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
</button>
<div id="scrim"></div>
<aside id="side" aria-label="Viewer menu">
  <div class="head"><h1>Mapa Acessivel</h1><button class="x" id="closeBtn" aria-label="Close menu">✕</button></div>
  <div>
    <h2>Zoom <span class="zoomval" id="zv">100%</span></h2>
    <input type="range" id="zoom" min="0" max="100" value="50" aria-label="Zoom level">
    <div class="row" style="margin-top:10px">
      <button class="btn" id="zout" aria-label="Zoom out">−</button>
      <button class="btn" id="zin" aria-label="Zoom in">+</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn" id="fit">Preencher</button>
      <button class="btn" id="actual">Tamanho real</button>
    </div>
  </div>
  <div>
    <h2>Pins</h2>
    <button class="btn report" id="report">Reportar</button>
  </div>
  <p class="tip">Arraste a imagem para se mover ou clique duplo para ampliar um ponto. Clique em um pino para ler sua descrição.</p>
</aside>
<div id="badge" aria-live="polite">100%</div>

<script>
(function(){
  var stage=document.getElementById('stage'),img=document.getElementById('img'),
      layer=document.getElementById('layer'),ghost=document.getElementById('ghost'),
      pop=document.getElementById('pop'),desc=document.getElementById('desc'),
      err=document.getElementById('err'),hint=document.getElementById('hint'),
      side=document.getElementById('side'),scrim=document.getElementById('scrim'),
      menuBtn=document.getElementById('menuBtn'),badge=document.getElementById('badge'),
      zv=document.getElementById('zv'),slider=document.getElementById('zoom');
  var x=0,y=0,k=1,minK=0.05,maxK=16,fitK=1;

  var PIN_SVG='<svg viewBox="0 0 28 36" width="28" height="36" aria-hidden="true"><path d="M14 35C14 35 2 21 2 13a12 12 0 0 1 24 0c0 8-12 22-12 22z" fill="#d62d20" stroke="#fff" stroke-width="2"/><circle cx="14" cy="13" r="4.5" fill="#fff"/></svg>';
  ghost.innerHTML=PIN_SVG;

  var pins=[],openPin=null,placing=false,nextId=1;

  function apply(){
    img.style.transform='translate('+x+'px,'+y+'px) scale('+k+')';
    var t=Math.round(k*100)+'%';badge.textContent=t;zv.textContent=t;
    slider.value=Math.round(100*Math.log(k/minK)/Math.log(maxK/minK));
    positionLayer();
  }

  function positionLayer(){
    pins.forEach(function(p){p.el.style.left=(x+p.ix*k)+'px';p.el.style.top=(y+p.iy*k)+'px';});
    if(openPin){
      var px=x+openPin.ix*k,py=y+openPin.iy*k,sw=stage.clientWidth,sh=stage.clientHeight,
          w=pop.offsetWidth,h=pop.offsetHeight,left=px+22;
      if(left+w>sw-8)left=px-22-w;
      left=Math.max(8,Math.min(left,sw-w-8));
      var top=Math.max(8,Math.min(py-30,sh-h-8));
      pop.style.left=left+'px';pop.style.top=top+'px';
    }
  }
  function zoomAt(cx,cy,nk){
    nk=Math.min(maxK,Math.max(minK,nk));
    x=cx-(cx-x)*(nk/k);y=cy-(cy-y)*(nk/k);k=nk;apply();
  }
  function center(){return [stage.clientWidth/2,stage.clientHeight/2];}
  function fit(){
    var w=img.naturalWidth||1,h=img.naturalHeight||1,sw=stage.clientWidth,sh=stage.clientHeight;
    fitK=Math.min(sw/w,sh/h)*0.94;minK=Math.min(0.05,fitK/2);
    k=fitK;x=(sw-w*k)/2;y=(sh-h*k)/2;apply();
  }
  function actual(){var c=center();zoomAt(c[0],c[1],1);}

  img.onload=fit;
  img.src="mapafacens.jpeg";
  window.addEventListener('resize',function(){if(Math.abs(k-fitK)<1e-6)fit();else positionLayer();});


  function showPop(p,focus){
    openPin=p;desc.value=p.text;desc.classList.remove('bad');err.textContent='';
    renderVotes();pop.style.display='block';positionLayer();if(focus)desc.focus();
  }

  var likeB=document.getElementById('like'),dislikeB=document.getElementById('dislike');
  function renderVotes(){
    if(!openPin)return;
    document.getElementById('nl').textContent=openPin.likes;
    document.getElementById('nd').textContent=openPin.dislikes;
    likeB.classList.toggle('on',openPin.vote==='like');dislikeB.classList.toggle('on',openPin.vote==='dislike');
    likeB.setAttribute('aria-pressed',openPin.vote==='like');dislikeB.setAttribute('aria-pressed',openPin.vote==='dislike');
    likeB.disabled=dislikeB.disabled=!desc.value.trim();
  }
  function vote(kind){
    var p=openPin;if(!p||!desc.value.trim())return;
    if(p.vote===kind){p[kind+'s']--;p.vote=null;}
    else{if(p.vote)p[p.vote+'s']--;p[kind+'s']++;p.vote=kind;}
    renderVotes();
  }
  likeB.onclick=function(){vote('like');};
  dislikeB.onclick=function(){vote('dislike');};

  function closePop(){
    if(!openPin)return true;
    if(!desc.value.trim()){
      desc.classList.add('bad');err.textContent='Add a description before closing.';desc.focus();return false;
    }
    openPin.text=desc.value;openPin=null;pop.style.display='none';return true;
  }
  desc.addEventListener('input',function(){
    if(openPin)openPin.text=desc.value;
    if(desc.value.trim()){desc.classList.remove('bad');err.textContent='';}
    renderVotes();
  });
  document.getElementById('popx').onclick=closePop;
  ['pointerdown','wheel','dblclick'].forEach(function(t){
    pop.addEventListener(t,function(e){e.stopPropagation();},{passive:true});
  });


  function addPin(ix,iy){
    var el=document.createElement('button');
    el.className='pin';el.type='button';el.setAttribute('aria-label','Open report');el.innerHTML=PIN_SVG;
    var p={id:nextId++,ix:ix,iy:iy,text:'',likes:0,dislikes:0,vote:null,el:el};
    el.addEventListener('pointerdown',function(e){e.stopPropagation();});
    el.addEventListener('dblclick',function(e){e.stopPropagation();});
    el.addEventListener('click',function(){
      if(openPin===p){closePop();return;}
      if(!closePop())return;
      showPop(p,false);
    });
    layer.appendChild(el);pins.push(p);return p;
  }


  function setPlacing(on){
    placing=on;stage.classList.toggle('placing',on);layer.classList.toggle('hold',on);
    hint.style.display=on?'block':'none';if(!on)ghost.style.display='none';
  }
  function moveGhost(e){
    var r=stage.getBoundingClientRect();
    ghost.style.left=(e.clientX-r.left)+'px';ghost.style.top=(e.clientY-r.top)+'px';ghost.style.display='block';
  }
  document.getElementById('report').onclick=function(){
    if(!closePop())return;
    setMenu(false);setPlacing(true);
  };
  stage.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse')ghost.style.display='none';});
  function placeAt(e){
    var r=stage.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top,
        ix=(sx-x)/k,iy=(sy-y)/k;
    if(ix<0||iy<0||ix>img.naturalWidth||iy>img.naturalHeight)return; // must land on the image
    setPlacing(false);showPop(addPin(ix,iy),true);
  }


  stage.addEventListener('wheel',function(e){
    e.preventDefault();
    var r=stage.getBoundingClientRect();
    zoomAt(e.clientX-r.left,e.clientY-r.top,k*Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0015)));
  },{passive:false});
  stage.addEventListener('dblclick',function(e){
    if(placing)return;
    var r=stage.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,k*2);
  });

  var ptrs=new Map(),lastDist=0,lastMid=null,down=null,moved=false;
  stage.addEventListener('pointerdown',function(e){
    stage.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1){down={x:e.clientX,y:e.clientY};moved=false;}else moved=true;
    stage.classList.add('drag');lastDist=0;lastMid=null;
    if(placing)moveGhost(e);
  });
  stage.addEventListener('pointermove',function(e){
    if(placing)moveGhost(e);
    var p=ptrs.get(e.pointerId);if(!p)return;
    if(ptrs.size===1){
      if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>6)moved=true;
      x+=e.clientX-p.x;y+=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;apply();
    }else if(ptrs.size===2){
      p.x=e.clientX;p.y=e.clientY;
      var a=Array.from(ptrs.values()),d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),
          mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2,r=stage.getBoundingClientRect();
      if(lastDist){x+=mx-lastMid.x;y+=my-lastMid.y;zoomAt(mx-r.left,my-r.top,k*d/lastDist);}
      lastDist=d;lastMid={x:mx,y:my};
    }
  });
  function up(e){
    var isClick=e.type==='pointerup'&&ptrs.size===1&&!moved;
    ptrs.delete(e.pointerId);lastDist=0;lastMid=null;
    if(!ptrs.size)stage.classList.remove('drag');
    if(isClick&&placing)placeAt(e);
  }
  stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);


  function setMenu(open){
    side.classList.toggle('open',open);scrim.classList.toggle('on',open);
    menuBtn.setAttribute('aria-expanded',open);menuBtn.setAttribute('aria-label',open?'Close menu':'Open menu');
    if(open)document.getElementById('closeBtn').focus();else if(!placing)menuBtn.focus();
  }
  menuBtn.onclick=function(){setMenu(!side.classList.contains('open'));};
  document.getElementById('closeBtn').onclick=function(){setMenu(false);};
  scrim.onclick=function(){setMenu(false);};
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    if(placing)setPlacing(false);
    else if(side.classList.contains('open'))setMenu(false);
    else closePop();
  });


  document.getElementById('zin').onclick=function(){var c=center();zoomAt(c[0],c[1],k*1.5);};
  document.getElementById('zout').onclick=function(){var c=center();zoomAt(c[0],c[1],k/1.5);};
  document.getElementById('fit').onclick=fit;
  document.getElementById('actual').onclick=actual;
  slider.oninput=function(){var c=center();zoomAt(c[0],c[1],minK*Math.pow(maxK/minK,slider.value/100));};
})();
</script>
</body>
</html>
